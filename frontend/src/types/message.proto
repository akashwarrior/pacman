syntax = "proto3";

// Position for players and bullets
message Position {
  double x = 1;
  double y = 2;
}

// Bullet - sent over WebSocket
message Bullet {
  double id = 1;
  Position position = 2;
  double rotation = 3;
  bool expired = 4;
  int32 owner_id = 5;
}

// Player - sent over WebSocket
message Player {
  int32 id = 1;
  string name = 2;
  string color = 3;
  Position position = 4;
  bool is_ready = 5;
  bool in_bush = 6;
  double rotation = 7;
  int32 kills = 8;
  int32 health = 9;
  int32 max_health = 10;
}

// Payload - WebSocket message payload
message Payload {
  repeated Player players = 1;
  optional Position position = 2;
  optional Bullet bullet = 3;
  optional bool is_ready = 5;
  optional bool in_bush = 6;
  optional int32 health = 7;
  optional double rotation = 8;
  optional int32 kills = 9;
}

// Message - WebSocket message wrapper
message Message {
  optional int32 id = 1;
  string event = 2;
  uint64 time = 3;
  optional Payload payload = 4;
}
